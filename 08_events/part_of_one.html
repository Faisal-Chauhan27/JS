<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Properties Example</title>
</head>
<body>

<button id="myButton">Click me</button>

<script>
  document.getElementById("myButton").addEventListener("click", function(event) {
    // Accessing event properties
    console.log("Event Type: " + event.type);           // "click"
    console.log("Event Timestamp: " + event.timeStamp); // Time when the event occurred
    console.log("Default Prevented: " + event.defaultPrevented); // false initially

    // Preventing default action (though buttons don't have a default action like forms)
    event.preventDefault();

    // Checking if default was prevented
    console.log("Default Prevented After: " + event.defaultPrevented); // true now
  });
</script>

</body>
</html>
